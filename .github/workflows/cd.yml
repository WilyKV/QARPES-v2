# =============================================================================
# CD — Deploiement continu ROVER (staging + production)
#
# Declenchement : tag staging-vX.Y.Z ou release-vX.Y.Z sur main
#
# Flux :
#   1. CI rapide (lint + typecheck) — validation minimale avant push
#   2. Push du code + tag vers le repo Azure DevOps
#   3. Azure DevOps prend le relais : CI complete, Docker build, push ACR
# =============================================================================

name: CD

on:
  push:
    tags:
      - "staging-v*"
      - "release-v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : Detection de l'environnement depuis le tag
  # ---------------------------------------------------------------------------
  detect-environment:
    name: Detection environnement
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Detecter environnement et version depuis le tag
        id: detect
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" == staging-v* ]]; then
            ENVIRONMENT="staging"
            VERSION="${TAG#staging-v}"
          elif [[ "${TAG}" == release-v* ]]; then
            ENVIRONMENT="production"
            VERSION="${TAG#release-v}"
          else
            echo "::error::Tag invalide : ${TAG}"
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Format de version invalide : ${VERSION}. Attendu : X.Y.Z"
            exit 1
          fi
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "## Detection" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environnement** : ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version** : ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 2 : CI rapide — lint + typecheck (pas de build complet)
  # ---------------------------------------------------------------------------
  quick-ci:
    name: CI rapide (lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [detect-environment]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run check

  # ---------------------------------------------------------------------------
  # Job 3 : Push code + tag vers Azure DevOps
  # Azure DevOps prend le relais : CI complete, Docker build, push ACR
  # ---------------------------------------------------------------------------
  push-to-azure-devops:
    name: "Push vers Azure DevOps [${{ needs.detect-environment.outputs.environment }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-environment, quick-ci]
    environment: ToAzureDevOps
    env:
      ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
      VERSION: ${{ needs.detect-environment.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config user.name "ROVER CI"
          git config user.email "ci@rover.dev"

      - name: Push vers Azure DevOps
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG: ${{ vars.AZURE_DEVOPS_ORG }}
          AZURE_DEVOPS_PROJECT: ${{ vars.AZURE_DEVOPS_PROJECT }}
          AZURE_DEVOPS_REPO: ${{ vars.AZURE_DEVOPS_REPO }}
        run: |
          echo "::add-mask::${AZURE_DEVOPS_PAT}"
          AZURE_REPO_URL="https://${AZURE_DEVOPS_PAT}@dev.azure.com/${AZURE_DEVOPS_ORG}/${AZURE_DEVOPS_PROJECT}/_git/${AZURE_DEVOPS_REPO}"
          git remote add azure "${AZURE_REPO_URL}"

          echo "## Push branche main..."
          git push azure HEAD:main --force

          TAG="${GITHUB_REF_NAME}"
          echo "## Push tag ${TAG}..."
          git push azure "refs/tags/${TAG}" --force

      - name: Resume
        env:
          AZURE_DEVOPS_ORG: ${{ vars.AZURE_DEVOPS_ORG }}
          AZURE_DEVOPS_PROJECT: ${{ vars.AZURE_DEVOPS_PROJECT }}
          AZURE_DEVOPS_REPO: ${{ vars.AZURE_DEVOPS_REPO }}
        run: |
          echo "## Push Azure DevOps OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Env** : ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version** : ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Org** : ${AZURE_DEVOPS_ORG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repo** : ${AZURE_DEVOPS_REPO}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Azure DevOps pipeline va se declencher automatiquement." >> "$GITHUB_STEP_SUMMARY"
