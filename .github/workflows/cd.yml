# =============================================================================
# CD — Deploiement continu ROVER
# Declenche UNIQUEMENT sur creation d'un tag v* (ex: v1.2.3) sur main.
# Relance la CI, puis build et push l'image Docker vers Azure Container Registry.
# =============================================================================

name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : Relancer la CI complete (quality + build)
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances
        run: npm ci --legacy-peer-deps

      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run check

      - name: Tests unitaires (Vitest)
        run: npm test

  build:
    name: Build backend + frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances
        run: npm ci --legacy-peer-deps

      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Build complet (esbuild + Vite)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 2 : Build image Docker production + push vers ACR
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker vers ACR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, build]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Extraction de la version depuis le tag git
        id: version
        run: |
          # Extraire la version du tag (v1.2.3 -> 1.2.3)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version detectee : ${VERSION}"

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_URL }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/rover:${{ steps.version.outputs.version }}
            ${{ secrets.AZURE_REGISTRY_URL }}/rover:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
