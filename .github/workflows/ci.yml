# =============================================================================
# CI — Integration continue ROVER
# Declenche sur chaque push vers main et chaque PR vers main.
# 3 jobs independants : quality, build, docker
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annuler les runs precedents sur la meme branche/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : Qualite du code (lint, typecheck, tests)
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances
        run: npm ci --legacy-peer-deps

      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run check

      - name: Tests unitaires — hors integration (Vitest)
        run: npm run test:ci
        env:
          SESSION_SECRET: ci-test-secret-not-for-production-use-xxxxxxxxxxxxxxxx

  # ---------------------------------------------------------------------------
  # Job 2 : Verification du build complet
  # ---------------------------------------------------------------------------
  build:
    name: Build backend + frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances
        run: npm ci --legacy-peer-deps

      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Build complet (esbuild + Vite)
        run: npm run build

      - name: Verification des artefacts de build
        run: |
          test -f dist/server/index.js || (echo "ERREUR: dist/server/index.js manquant" && exit 1)
          test -d dist/public || (echo "ERREUR: dist/public/ manquant" && exit 1)
          echo "Build verifie avec succes"

  # ---------------------------------------------------------------------------
  # Job 3 : Validation du build Docker (sans push)
  # ---------------------------------------------------------------------------
  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image Docker production (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: rover:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
