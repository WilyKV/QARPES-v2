# =============================================================================
# Azure DevOps Pipeline — CI + Build Docker ROVER
#
# Declenchement : chaque modification de la branche "main"
# (poussee par GitHub Actions CD apres un tag staging-v* ou release-v*)
#
# Etapes :
#   1. CI    — Lint, typecheck, tests unitaires, build applicatif
#   2. Docker — Build image + push vers ACR (rover:<BuildId>)
#
# La release (deploiement) est geree manuellement via Azure DevOps Releases.
# =============================================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "22"
  imageName: "rover"
  # Connexion de service vers le registre ACR
  serviceConnection: "TechLeads-Inseecacr-DEV-sc"

stages:
  # ---------------------------------------------------------------------------
  # Stage 1 : CI — Qualite du code et build applicatif
  # ---------------------------------------------------------------------------
  - stage: CI
    displayName: "CI — Lint, Typecheck, Tests, Build"
    jobs:
      - job: Quality
        displayName: "Lint + Typecheck + Tests"
        steps:
          - task: NodeTool@0
            displayName: "Installer Node.js $(nodeVersion)"
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci --legacy-peer-deps
            displayName: "Installation des dependances"

          - script: npx prisma generate
            displayName: "Generation du client Prisma"

          - script: npm run lint
            displayName: "Lint (ESLint)"

          - script: npm run check
            displayName: "Typecheck (tsc --noEmit)"

          - script: npm run test:ci
            displayName: "Tests unitaires (Vitest)"
            env:
              SESSION_SECRET: ci-test-secret-not-for-production-use-xxxxxxxxxxxxxxxx

          - script: npm run build
            displayName: "Build complet (esbuild + Vite)"

          - script: |
              test -f dist/server/index.js || (echo "ERREUR: dist/server/index.js manquant" && exit 1)
              test -d dist/public || (echo "ERREUR: dist/public/ manquant" && exit 1)
              echo "Build verifie avec succes"
            displayName: "Verification des artefacts"

  # ---------------------------------------------------------------------------
  # Stage 2 : Build image Docker + push vers ACR
  # Tag de l'image : rover:<BuildId>
  # ---------------------------------------------------------------------------
  - stage: Docker
    displayName: "Docker — Build & Push ACR"
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        displayName: "Build rover:$(Build.BuildId)"
        steps:
          - task: Docker@2
            displayName: "Build et push image Docker"
            inputs:
              containerRegistry: $(serviceConnection)
              repository: $(imageName)
              command: buildAndPush
              Dockerfile: "$(Build.SourcesDirectory)/Dockerfile"
              buildContext: "$(Build.SourcesDirectory)"
              tags: |
                $(Build.BuildId)
                latest
