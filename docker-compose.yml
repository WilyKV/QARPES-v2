services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: rover-app-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:8080"
      - "5173:5173"
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rover-net
    volumes:
      - ./:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    container_name: rover-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rover
      POSTGRES_USER: rover
      POSTGRES_PASSWORD: rover
    ports:
      - "5433:5432"
    volumes:
      - rover-db-data:/var/lib/postgresql/data
    networks:
      - rover-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rover -d rover"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rover-db-data:

networks:
  rover-net:
    driver: bridge
